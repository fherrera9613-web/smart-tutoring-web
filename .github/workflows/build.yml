name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/SmartTutoring.Api/SmartTutoring.Api.csproj

      - name: Build backend
        run: dotnet build backend/SmartTutoring.Api/SmartTutoring.Api.csproj --configuration Release --no-restore

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  integration:
    name: API y migraciones (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smartpass
          POSTGRES_DB: smart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart -d smart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Arranque y aplicación de migraciones reales
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5055
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=smart_test;Username=smart;Password=smartpass
          Jwt__Key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          Jwt__Issuer: SMARTTutoring.Api
          Jwt__Audience: SMARTTutoring.Web
        run: |
          dotnet run --project backend/SmartTutoring.Api/SmartTutoring.Api.csproj --no-launch-profile > api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5055/health; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1
