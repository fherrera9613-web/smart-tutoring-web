name: Sync EF Snapshot

on:
  push:
    branches:
      - fix/ef-snapshot
    paths:
      - .github/workflows/sync-ef-snapshot.yml

permissions:
  contents: write

jobs:
  sync-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ef-snapshot

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        working-directory: backend/SmartTutoring.Api
        run: dotnet restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Generate current model snapshot
        working-directory: backend/SmartTutoring.Api
        run: dotnet ef migrations add SnapshotSync --no-build

      - name: Keep only the generated snapshot
        run: |
          rm backend/SmartTutoring.Api/Migrations/*_SnapshotSync.cs
          rm backend/SmartTutoring.Api/Migrations/*_SnapshotSync.Designer.cs
          git status --short

      - name: Commit synchronized snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/SmartTutoring.Api/Migrations/SmartTutoringDbContextModelSnapshot.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix: sincronizar snapshot de EF Core"
          git push origin HEAD:fix/ef-snapshot
